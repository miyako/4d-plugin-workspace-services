# Builds the plugin for Windows (x64) first, then macOS as a universal
# (arm64 + x86_64) binary, merges both into the single cross-platform
# .bundle, codesigns + notarizes the mac binary, and publishes a GitHub
# Release with the zip and dmg attached.
#
# Trigger: push a tag matching v*.*.* (either by hand, or via bump-version.yml).
# You can also run it manually against an existing tag with workflow_dispatch.
#
# PORTABILITY: Edit only PRODUCT_NAME below. Everything else is derived.
# Canonical 4D layout is enforced:
#   <Product>.4dbase/Plugins/<Product>.bundle/Contents/MacOS/<Product>
#   <Product>.4dbase/Plugins/<Product>.bundle/Contents/Windows64/<Product>.4DX
#   <Product>.4dbase/Plugins/<Product>.bundle/Contents/Resources/...

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v2.3.0)
        required: true

permissions:
  contents: write

env:
  # ---- only this needs editing per-project ----
  PRODUCT_NAME: Workspace Services
  MACOS_DEPLOYMENT_TARGET: '11.0'
  # ---------------------------------------------

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: clean stale bundle outputs
        shell: pwsh
        run: |
          $product = "${{ env.PRODUCT_NAME }}"
          # Remove both canonical and legacy lower-case paths to avoid case-insensitive ghosts
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$product.4dbase/Plugins/$product.bundle"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$product.4dbase/plugins"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$product.4dbase/Plugins/Default"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "Objs"

      # GitHub-hosted windows-latest ships VS2022 (v143 toolset) but not the
      # legacy v140 toolset the project may be pinned to, so we override it on
      # the command line rather than requiring an extra VS component install.
      # Same for WindowsTargetPlatformVersion=8.1 -> 10.0
      - name: build x64
        shell: cmd
        run: |
          msbuild "%PRODUCT_NAME%.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: normalize windows output to canonical case
        shell: pwsh
        run: |
          $product = "${{ env.PRODUCT_NAME }}"
          $canonicalDir = "$product.4dbase/Plugins/$product.bundle/Contents/Windows64"
          New-Item -ItemType Directory -Force -Path $canonicalDir | Out-Null

          # msbuild may have created plugins/contents/windows64 (lower-case) due to vcxproj settings.
          # Find the built .4DX wherever it landed, case-insensitive.
          $found = Get-ChildItem -Recurse -Filter "$product.4DX" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*4dbase*" } | Select-Object -First 1
          if (-not $found) {
            Write-Host "Searching all..."
            Get-ChildItem -Recurse -Filter "*.4DX" | ForEach-Object { Write-Host $_.FullName }
            Write-Error "Windows binary $product.4DX not found after build"
            exit 1
          }
          Write-Host "Found Windows binary at: $($found.FullName)"
          Copy-Item $found.FullName "$canonicalDir/$product.4DX" -Force
          Get-ChildItem "$canonicalDir"

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          # canonical case only - portable for macOS job
          path: ${{ env.PRODUCT_NAME }}.4dbase/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          XCODE_PROJECT="${PRODUCT}.xcodeproj"
          XCODE_TARGET="${PRODUCT}"
          FOURD_BASE="${PRODUCT}.4dbase"
          PLUGINS_DIR="${FOURD_BASE}/Plugins"

          echo "Cleaning stale outputs to avoid /Default/ vs / bug and case ghosts"
          rm -rf "${PLUGINS_DIR}/${PRODUCT}.bundle"
          rm -rf "${PLUGINS_DIR}/Default"
          rm -rf "${FOURD_BASE}/plugins" # legacy lower-case
          rm -rf "${FOURD_BASE}/Plugins/${PRODUCT}.build"

          echo "Building $XCODE_PROJECT / $XCODE_TARGET"
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            build

          echo "Built contents:"
          ls -R "$PLUGINS_DIR"

      - name: verify universal binary
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BIN="${PRODUCT}.4dbase/Plugins/${PRODUCT}.bundle/Contents/MacOS/${PRODUCT}"
          
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found at $BIN - CONFIGURATION_BUILD_DIR mismatch?"
            ls -R "${PRODUCT}.4dbase"
            exit 1
          fi
          
          echo "Binary timestamp (must be recent):"
          ls -lT "$BIN" || ls -l --time-style=full "$BIN"
          
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64"
          lipo -info "$BIN" | grep -q "x86_64"
          echo "Verified universal binary"

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          BUNDLE="${PRODUCT}.4dbase/Plugins/${PRODUCT}.bundle"
          
          mkdir -p "$BUNDLE/Contents/Windows64"
          
          # winbuild contains the single .4DX file downloaded from Windows job
          echo "winbuild contents:"
          ls -R winbuild
          
          # Handle case where artifact preserved subfolder structure (fallback)
          SRC=$(find winbuild -name "${PRODUCT}.4DX" -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::Windows binary ${PRODUCT}.4DX not found in winbuild/"
            exit 1
          fi
          
          echo "Copying $SRC -> $BUNDLE/Contents/Windows64/${PRODUCT}.4DX"
          cp "$SRC" "$BUNDLE/Contents/Windows64/${PRODUCT}.4DX"
          
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
          ls -R "$BUNDLE/Contents"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          PRODUCT="${{ env.PRODUCT_NAME }}"
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${PRODUCT}-${VERSION}.zip"
          DMG_PATH="${PRODUCT}-${VERSION}.dmg"

          echo "Creating $ZIP_PATH from $BUNDLE_PATH"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          echo "Creating $DMG_PATH from $BUNDLE_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          echo "Submitting for notarization..."
          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -lh "$ZIP_PATH" "$DMG_PATH"

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
